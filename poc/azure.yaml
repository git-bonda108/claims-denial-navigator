# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: denial-navigator-poc
services:
  web:
    project: .
    language: py
    host: containerapp
    docker:
      path: Dockerfile
      remoteBuild: true   # image is built in Azure Container Registry - no local Docker needed
infra:
  provider: bicep
  path: infra
